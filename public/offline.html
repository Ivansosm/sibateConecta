<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#112d39"><title>SIBATÉ Conecta · Sin conexión</title><link rel="icon" href="/icon-192.png"><style>*{box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;color:#17313e;background:#f4f7fa;margin:0}header{background:#112d39;color:white;padding:24px;font-weight:700;font-size:22px}main{max-width:1100px;margin:auto;padding:28px 20px}h1{font-size:30px}p{color:#526a76;line-height:1.6}.banner{padding:15px 18px;background:#fff2cf;border:1px solid #ddcfa0;border-radius:8px}button,input,select{font:inherit;padding:12px;border:1px solid #c8d9e0;border-radius:7px;background:#fff}button{cursor:pointer;color:#087f68}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e0a330}nav{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}input{flex:1;min-width:180px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}article{border:1px solid #d7e4e8;border-radius:12px;background:#fff;overflow:hidden}article img{width:100%;height:190px;object-fit:cover}.body{padding:20px}.body p{font-size:14px}.price{font-size:22px;font-weight:700}a{color:#087f68}small{display:block;color:#536b76;margin-top:10px;line-height:1.6}</style></head><body><header>SIBATÉ Conecta</header><main><div class="banner">Sin conexión · Catálogo guardado para consulta</div><h1>Tus opciones en Sibaté</h1><p>La disponibilidad puede haber cambiado. Conéctate para enviar una solicitud o consultar su estado.</p><nav><select id="category" aria-label="Categoría"><option>Hospedaje</option><option>Alimentación</option></select><input id="search" placeholder="Buscar en el catálogo" aria-label="Buscar servicios"><button onclick="location.href='/'">Volver a conectar</button></nav><p id="saved"></p><div id="cards"></div><small>Ofertas e imágenes de ejemplo. Piloto privado sin pagos reales.</small></main><script>let data={listings:[]};const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);function draw(){const parent=document.getElementById('cards');parent.replaceChildren();const category=document.getElementById('category').value,q=document.getElementById('search').value.toLowerCase();const rows=(data.listings||[]).filter(l=>l.active&&l.category===category&&(l.title+' '+l.features+' '+l.provider).toLowerCase().includes(q));for(const l of rows){const card=document.createElement('article'),img=document.createElement('img'),body=document.createElement('div');img.src=l.category==='Hospedaje'?'/habitacion.png':'/almuerzo.png';img.alt='Imagen ilustrativa del servicio';body.className='body';for(const [tag,value]of [['small',l.zone+' · '+(l.available?'Disponible al guardar':'Sin cupo al guardar')],['h2',l.title],['p',l.provider],['p',l.features],['div',money(l.price)+(l.category==='Hospedaje'?' / 30 días':' / comida')],['small','Imagen ilustrativa · oferta de prueba']]){const el=document.createElement(tag);el.textContent=value;if(tag==='div')el.className='price';body.append(el);}card.append(img,body);parent.append(card);}if(!rows.length){const p=document.createElement('p');p.textContent='No hay opciones guardadas para esta búsqueda. Abre la aplicación con internet para guardar el catálogo.';parent.append(p);}}fetch('/offline-catalog.json').then(r=>r.json()).then(s=>{data=s;document.getElementById('saved').textContent=s.savedAt?'Última copia: '+new Date(s.savedAt).toLocaleString('es-CO',{timeZone:'America/Bogota'}):'';draw();}).catch(draw);document.getElementById('category').addEventListener('change',draw);document.getElementById('search').addEventListener('input',draw);</script></body></html>
